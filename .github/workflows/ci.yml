name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  EMSCRIPTEN_VERSION: 4.0.11
  SCONS_VERSION: 4.11.1

jobs:
  units:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python tools/run_tests.py --only units --build --fail-on-skip

  vm:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: .emsdk-cache
          cache-key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - run: '"VERSE_EMSDK=$env:EMSDK" >> $env:GITHUB_ENV'
      - run: python tools/build_verse_vm.py
      - run: python tools/build_verse_vm.py --wasm

  gdextension:
    name: gdextension (${{ matrix.name }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor
            args: target=editor
          - name: template_release
            args: target=template_release
          - name: web-nothreads
            args: platform=web arch=wasm32 threads=no target=template_release
            web: true
          - name: web-threads
            args: platform=web arch=wasm32 threads=yes target=template_release
            web: true
    env:
      SCONS_CACHE: ${{ github.workspace }}/.scons-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install scons==${{ env.SCONS_VERSION }}
      - id: keys
        run: |
          "godot-cpp=$(git rev-parse HEAD:godot-cpp)" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      # godot-cpp turns SCONS_CACHE into a CacheDir, which is content-addressed on each command
      # line and its inputs but not on the compiler binary: the runner image and the emsdk version
      # are in the key for that reason.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCONS_CACHE }}
          key: scons-${{ matrix.name }}-${{ steps.keys.outputs.image }}-emsdk${{ env.EMSCRIPTEN_VERSION }}-${{ steps.keys.outputs.godot-cpp }}-${{ hashFiles('SConstruct', 'src/**', 'vm/**', 'include/**') }}
          restore-keys: |
            scons-${{ matrix.name }}-${{ steps.keys.outputs.image }}-emsdk${{ env.EMSCRIPTEN_VERSION }}-${{ steps.keys.outputs.godot-cpp }}-
      - if: matrix.web
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: .emsdk-cache
          cache-key: emsdk-${{ env.EMSCRIPTEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: matrix.web
        run: '"VERSE_EMSDK=$env:EMSDK" >> $env:GITHUB_ENV'
      - if: ${{ !matrix.web }}
        run: scons ${{ matrix.args }}
      # godot-cpp falls back to MinGW when SCons cannot find MSVC, which would pass while testing
      # a compiler no release is built with; only MSVC names its library .lib.
      - if: ${{ !matrix.web }}
        run: if (-not (Test-Path godot-cpp/bin/*.lib)) { throw "godot-cpp was not built with MSVC" }
      - if: matrix.web
        run: python tools/emsdk_env.py -- scons ${{ matrix.args }}
